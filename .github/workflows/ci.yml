name: CI

on:
  push:
    branches: [main, build/stride]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stride
          POSTGRES_PASSWORD: stride
          POSTGRES_DB: stride_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stride" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://stride:stride@localhost:5432/stride_test
      TEST_DATABASE_URL: postgresql://stride:stride@localhost:5432/stride_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: Browser smoke test
    runs-on: ubuntu-latest
    needs: checks
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stride
          POSTGRES_PASSWORD: stride
          POSTGRES_DB: stride
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stride" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://stride:stride@localhost:5432/stride
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-validation-0123456789
      CORS_ORIGINS: http://localhost:5173
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - run: pnpm --filter @stride/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
